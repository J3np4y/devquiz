version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.72.1 solo admite TypeScript por debajo de 6.1. Quitar cuando admita la 7.
      - dependency-name: typescript
        versions: ['>=7.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ['*']
