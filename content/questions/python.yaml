- id: py-with-001
  topic: python
  difficulty: intermedio
  type: concept
  prompt: "¿Qué garantiza un bloque `with open(...) as f`?"
  options:
    - { id: a, text: "Que el archivo se lee completo en memoria antes de ejecutar el contenido del bloque" }
    - { id: b, text: "Que ningún otro proceso puede abrir el archivo" }
    - { id: c, text: "Que el archivo se cierra al salir, aunque haya una excepción" }
    - { id: d, text: "Que las excepciones del bloque quedan silenciadas" }
  correct: c
  explanation: "`with` llama a `__exit__` del gestor de contexto al salir del bloque, tanto si termina con normalidad como si se lanza una excepción. El archivo se cierra y la excepción sigue propagándose."

- id: py-lambda-001
  topic: python
  difficulty: avanzado
  type: code
  language: python
  prompt: "¿Qué imprime este código?"
  code: |
    funcs = [lambda: i for i in range(3)]
    print([f() for f in funcs])
  options:
    - { id: a, text: "[0, 1, 2]" }
    - { id: b, text: "[2, 2, 2]" }
    - { id: c, text: "[3, 3, 3]" }
    - { id: d, text: "[0, 0, 0]" }
  correct: b
  explanation: "Las funciones capturan la variable `i`, no su valor en cada vuelta, y la consultan al ejecutarse. Para entonces vale 2, su último valor. Con `lambda i=i: i` se fijaría el valor de cada vuelta."
  verify: output

- id: py-generador-001
  topic: python
  difficulty: avanzado
  type: code
  language: python
  prompt: "¿Qué imprime este código?"
  code: |
    def numbers():
        print("inicio")
        yield 1
        print("fin")

    g = numbers()
    print("creado")
    print(next(g))
  options:
    - { id: a, text: "inicio\ncreado\n1" }
    - { id: b, text: "creado\ninicio\n1" }
    - { id: c, text: "creado\ninicio\n1\nfin" }
    - { id: d, text: "inicio\n1\nfin\ncreado" }
  correct: b
  explanation: "Llamar a un generador no ejecuta su cuerpo. `next` lo ejecuta hasta el primer `yield` y lo deja en pausa, por lo que \"fin\" nunca llega a imprimirse."
  verify: output

- id: py-gil-001
  topic: python
  difficulty: avanzado
  type: concept
  prompt: "En CPython con GIL activo, ¿qué tipo de tarea se beneficia más de usar `threading`?"
  options:
    - { id: a, text: "Cálculos numéricos intensivos en Python puro" }
    - { id: b, text: "Operaciones de red o de disco que pasan tiempo esperando" }
    - { id: c, text: "Bucles de procesado de texto en Python puro" }
    - { id: d, text: "Compresión de datos escrita en Python puro" }
  correct: b
  explanation: "El GIL solo deja ejecutar bytecode de Python a un hilo cada vez, pero se libera durante las esperas de entrada y salida. Para trabajo de CPU se suele recurrir a `multiprocessing`."

