- id: py-decorador-001
  topic: python
  difficulty: avanzado
  type: code
  language: python
  prompt: "¿Qué imprime este código?"
  code: |
    def twice(func):
        def wrapper(x):
            return func(func(x))
        return wrapper

    @twice
    def increment(x):
        return x + 1

    print(increment(1))
  options:
    - { id: a, text: "2" }
    - { id: b, text: "3" }
    - { id: c, text: "4" }
    - { id: d, text: "1" }
  correct: b
  explanation: "`@twice` sustituye `increment` por `wrapper`, que llama dos veces a la función original: 1 pasa a 2, y 2 pasa a 3."
  verify: output

- id: py-clase-001
  topic: python
  difficulty: avanzado
  type: code
  language: python
  prompt: "¿Qué imprime este código?"
  code: |
    class Cart:
        items = []

    a = Cart()
    b = Cart()
    a.items.append(1)
    print(b.items)
  options:
    - { id: a, text: "[]" }
    - { id: b, text: "None" }
    - { id: c, text: "[1]" }
    - { id: d, text: "AttributeError" }
  correct: c
  explanation: "`items` es un atributo de clase, así que lo comparten todas las instancias. Para que cada una tenga el suyo, se crea en `__init__` con `self.items = []`."
  verify: output

- id: py-mro-001
  topic: python
  difficulty: avanzado
  type: code
  language: python
  prompt: "¿Qué imprime este código?"
  code: |
    class A:
        def who(self):
            return "A"

    class B(A):
        def who(self):
            return "B" + super().who()

    class C(A):
        def who(self):
            return "C" + super().who()

    class D(B, C):
        pass

    print(D().who())
  options:
    - { id: a, text: "BA" }
    - { id: b, text: "BCA" }
    - { id: c, text: "BAC" }
    - { id: d, text: "CBA" }
  correct: b
  explanation: "`super()` no apunta al padre directo, sino a la siguiente clase del orden de resolución de `D`, que es D, B, C, A. Por eso, desde `B` se llega a `C`."
  verify: output

- id: py-asyncio-001
  topic: python
  difficulty: avanzado
  type: concept
  prompt: "¿Qué ocurre si una corrutina de `asyncio` llama a `time.sleep(5)`?"
  options:
    - { id: a, text: "Solo se pausa esa corrutina, y las demás siguen" }
    - { id: b, text: "Se bloquea todo el bucle de eventos durante 5 segundos" }
    - { id: c, text: "Python la convierte automáticamente en `asyncio.sleep`" }
    - { id: d, text: "Se lanza una excepción por usar una función síncrona" }
  correct: b
  explanation: "`time.sleep` no cede el control, así que ninguna otra corrutina puede avanzar. Dentro de una corrutina se usa `await asyncio.sleep(5)`."
