- id: py-copia-001
  topic: python
  difficulty: intermedio
  type: code
  language: python
  prompt: "¿Qué imprime este código?"
  code: |
    import copy

    a = [[1], [2]]
    shallow = a.copy()
    deep = copy.deepcopy(a)
    a[0].append(9)

    print(shallow[0], deep[0])
  options:
    - { id: a, text: "[1] [1]" }
    - { id: b, text: "[1, 9] [1, 9]" }
    - { id: c, text: "[1, 9] [1]" }
    - { id: d, text: "[1] [1, 9]" }
  correct: c
  explanation: "`copy()` crea una lista nueva, pero comparte las listas interiores con la original. `deepcopy` copia también los objetos interiores, así que no le afecta el cambio."
  verify: output

