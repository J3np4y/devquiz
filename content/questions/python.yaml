- id: py-referencias-001
  topic: python
  difficulty: principiante
  type: code
  language: python
  prompt: "¿Qué imprime este código?"
  code: |
    a = [1, 2]
    b = a
    b.append(3)
    print(a)
  options:
    - { id: a, text: "[1, 2]" }
    - { id: b, text: "[1, 2, 3]" }
    - { id: c, text: "[3]" }
    - { id: d, text: "None" }
  correct: b
  explanation: "`b = a` no copia la lista: ambos nombres apuntan al mismo objeto, así que el cambio se ve desde los dos. Para copiarla se usa `a.copy()`."
  verify: output

