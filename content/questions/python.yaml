- id: py-tuplas-001
  topic: python
  difficulty: principiante
  type: concept
  prompt: "¿Cuál es la diferencia principal entre una lista y una tupla?"
  options:
    - { id: a, text: "La tupla no se puede modificar tras crearla" }
    - { id: b, text: "La lista solo admite elementos de un tipo" }
    - { id: c, text: "La tupla no conserva el orden de sus elementos" }
    - { id: d, text: "La lista no admite elementos repetidos" }
  correct: a
  explanation: "Las tuplas son inmutables y las listas, mutables. Ambas conservan el orden, admiten repetidos y pueden mezclar tipos."

- id: py-default-001
  topic: python
  difficulty: intermedio
  type: code
  language: python
  prompt: "¿Qué imprime este código?"
  code: |
    def add(item, items=[]):
        items.append(item)
        return items

    add(1)
    print(add(2))
  options:
    - { id: a, text: "[2]" }
    - { id: b, text: "[1, 2]" }
    - { id: c, text: "[1]" }
    - { id: d, text: "[]" }
  correct: b
  explanation: "El valor por defecto se evalúa una sola vez, al definir la función, así que todas las llamadas comparten la misma lista. Lo habitual es usar `items=None` y crearla dentro."
  verify: output

