    - { id: b, text: "Cuando los datos contienen números negativos" }
    - { id: c, text: "Cuando el pivote es siempre el valor mediano de cada partición que se va procesando" }
    - { id: d, text: "Cuando hay más datos que memoria caché disponible" }
  correct: a
  explanation: "Si el pivote deja casi todos los elementos a un lado, cada paso reduce el problema en muy poco. Por ejemplo, ocurre con datos ya ordenados si el pivote es siempre el primero. Elegirlo al azar lo hace muy improbable."

- id: fund-topologico-001
