- id: fund-bfs-001
  topic: fundamentos
  difficulty: avanzado
  type: code
  language: python
  prompt: "¿Qué imprime este recorrido del grafo?"
  code: |
    from collections import deque

    graph = {"A": ["B", "C"], "B": ["D"], "C": ["E"], "D": [], "E": []}
    seen = {"A"}
    queue = deque(["A"])
    order = []

    while queue:
        node = queue.popleft()
        order.append(node)
        for neighbor in graph[node]:
            if neighbor not in seen:
                seen.add(neighbor)
                queue.append(neighbor)

    print("".join(order))
  options:
    - { id: a, text: "ABDCE" }
    - { id: b, text: "ABCDE" }
    - { id: c, text: "ACEBD" }
    - { id: d, text: "ABCED" }
  correct: b
  explanation: "Es un recorrido en anchura: la cola hace que se visiten todos los nodos de un nivel antes de pasar al siguiente. Un recorrido en profundidad daría ABDCE."
  verify: output

- id: fund-amortizado-001
  topic: fundamentos
  difficulty: avanzado
  type: concept
  prompt: "¿Por qué añadir al final de un array dinámico tiene coste amortizado O(1)?"
  options:
    - { id: a, text: "Porque nunca hace falta mover los elementos existentes" }
    - { id: b, text: "Porque la capacidad crece en proporción y las copias son infrecuentes" }
    - { id: c, text: "Porque la memoria se reserva por adelantado para el tamaño máximo que pueda alcanzar el array" }
    - { id: d, text: "Porque internamente los elementos se guardan en una lista enlazada" }
  correct: b
  explanation: "Al llenarse, el array se copia a uno mayor, por ejemplo del doble de capacidad. Esa copia cuesta O(n), pero ocurre tan pocas veces que, repartida entre todas las inserciones, el coste medio es constante."

