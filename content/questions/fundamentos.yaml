- id: fund-complejidad-001
  topic: fundamentos
  difficulty: intermedio
  type: code
  language: python
  prompt: "¿Cuál es la complejidad temporal de esta función en el peor caso?"
  code: |
    def has_duplicates(items):
        for i in range(len(items)):
            for j in range(i + 1, len(items)):
                if items[i] == items[j]:
                    return True
        return False
  options:
    - { id: a, text: "O(n)" }
    - { id: b, text: "O(n log n)" }
    - { id: c, text: "O(n²)" }
    - { id: d, text: "O(2ⁿ)" }
  correct: c
  explanation: "Sin duplicados se comparan todos los pares, n(n-1)/2 en total, lo que crece como n². Usando un conjunto se puede resolver en O(n) de media."

- id: fund-hash-001
  topic: fundamentos
  difficulty: intermedio
  type: concept
  prompt: "¿Cuál es el coste de buscar una clave en una tabla hash, de media y en el peor caso?"
  options:
    - { id: a, text: "O(1) de media y O(n) en el peor caso" }
    - { id: b, text: "O(1) de media y O(1) en el peor caso" }
    - { id: c, text: "O(log n) de media y O(n) en el peor caso" }
    - { id: d, text: "O(n) de media y O(n²) en el peor caso" }
