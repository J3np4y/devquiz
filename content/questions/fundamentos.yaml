- id: fund-inorden-001
  topic: fundamentos
  difficulty: intermedio
  type: code
  language: python
  prompt: "¿Qué imprime este recorrido del árbol?"
  code: |
    def inorder(node):
        if node is None:
            return []
        left, value, right = node
        return inorder(left) + [value] + inorder(right)

    tree = ((None, 1, None), 2, (None, 3, None))
    print(inorder(tree))
  options:
    - { id: a, text: "[2, 1, 3]" }
    - { id: b, text: "[1, 3, 2]" }
    - { id: c, text: "[3, 2, 1]" }
    - { id: d, text: "[1, 2, 3]" }
  correct: d
  explanation: "El recorrido en orden visita la rama izquierda, el nodo y la rama derecha. En un árbol binario de búsqueda, esto devuelve los valores ordenados."
  verify: output

- id: fund-log-001
  topic: fundamentos
  difficulty: intermedio
  type: code
  language: python
  prompt: "¿Cuál es la complejidad temporal de esta función en el peor caso?"
  code: |
    def search(items, target):
        low, high = 0, len(items) - 1
        while low <= high:
            middle = (low + high) // 2
            if items[middle] == target:
                return middle
            if items[middle] < target:
                low = middle + 1
            else:
                high = middle - 1
        return -1
  options:
    - { id: a, text: "O(1)" }
    - { id: b, text: "O(log n)" }
    - { id: c, text: "O(n)" }
    - { id: d, text: "O(n log n)" }
  correct: b
  explanation: "Es una búsqueda binaria: cada vuelta descarta la mitad de los elementos que quedan, así que el número de vueltas crece con el logaritmo de n."

