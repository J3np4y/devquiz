- id: fund-pila-001
  topic: fundamentos
  difficulty: principiante
  type: code
  language: python
  prompt: "¿Qué imprime este código?"
  code: |
    stack = []
    stack.append(1)
    stack.append(2)
    stack.append(3)
    stack.pop()
    print(stack[-1])
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "None" }
  correct: b
  explanation: "Una pila saca primero lo último que entró. `pop` retira el 3, así que el elemento superior pasa a ser el 2."
  verify: output

- id: fund-cola-001
  topic: fundamentos
  difficulty: principiante
  type: concept
  prompt: "¿Qué estructura de datos atiende los elementos en el mismo orden en que llegaron?"
  options:
    - { id: a, text: "Una pila" }
    - { id: b, text: "Una cola" }
    - { id: c, text: "Un conjunto" }
    - { id: d, text: "Un árbol binario" }
  correct: b
  explanation: "Una cola sigue el orden FIFO: el primero en entrar es el primero en salir. Una pila hace lo contrario."

- id: fund-binaria-001
  topic: fundamentos
  difficulty: principiante
  type: concept
  prompt: "¿Qué condición deben cumplir los datos para aplicar una búsqueda binaria?"
  options:
    - { id: a, text: "No pueden contener valores repetidos" }
    - { id: b, text: "Deben estar ordenados" }
    - { id: c, text: "Deben ser números enteros" }
