- id: fund-complejidad-001
  topic: fundamentos
  difficulty: intermedio
  type: code
  language: python
  prompt: "¿Cuál es la complejidad temporal de esta función en el peor caso?"
  code: |
    def has_duplicates(items):
        for i in range(len(items)):
            for j in range(i + 1, len(items)):
                if items[i] == items[j]:
                    return True
        return False
  options:
    - { id: a, text: "O(n)" }
    - { id: b, text: "O(n log n)" }
    - { id: c, text: "O(n²)" }
