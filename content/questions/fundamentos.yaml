- id: fund-memo-001
  topic: fundamentos
  difficulty: avanzado
  type: code
  language: python
  prompt: "¿Qué imprime este código?"
  code: |
    calls = 0

    def fib(n, memo={}):
        global calls
        calls += 1
        if n < 2:
            return n
        if n not in memo:
            memo[n] = fib(n - 1) + fib(n - 2)
        return memo[n]

    fib(5)
    print(calls)
  options:
    - { id: a, text: "5" }
    - { id: b, text: "15" }
    - { id: c, text: "9" }
    - { id: d, text: "32" }
  correct: c
  explanation: "La memoización evita repetir cálculos: cada valor se calcula una vez y las llamadas siguientes lo reutilizan. Sin ella, `fib(5)` haría 15 llamadas, y el coste crecería de forma exponencial."
  verify: output

