- id: sql-where-001
  topic: sql
  difficulty: principiante
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE users (name TEXT, age INTEGER);
    INSERT INTO users VALUES ('Eva', 25), ('Luis', 17), ('Ana', 30);

    SELECT name FROM users WHERE age >= 18 ORDER BY name;
  options:
    - { id: a, text: "Eva\nAna" }
    - { id: b, text: "Ana\nEva" }
    - { id: c, text: "Ana\nEva\nLuis" }
    - { id: d, text: "Ana" }
  correct: b
  explanation: "`WHERE` descarta a Luis por tener menos de 18, y `ORDER BY name` ordena el resto alfabéticamente."
  verify: output

- id: sql-limit-001
  topic: sql
  difficulty: principiante
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE products (name TEXT, price INTEGER);
    INSERT INTO products VALUES ('Lápiz', 1), ('Libro', 15), ('Mochila', 30);

    SELECT name FROM products ORDER BY price DESC LIMIT 1;
  options:
    - { id: a, text: "Lápiz" }
    - { id: b, text: "Libro" }
    - { id: c, text: "Mochila" }
    - { id: d, text: "30" }
  correct: c
  explanation: "`ORDER BY price DESC` coloca primero el precio más alto y `LIMIT 1` se queda solo con esa fila. Únicamente se selecciona la columna `name`."
  verify: output

- id: sql-clave-001
  topic: sql
  difficulty: principiante
  type: concept
  prompt: "¿Para qué sirve una clave primaria?"
  options:
    - { id: a, text: "Para identificar de forma única cada fila de la tabla" }
    - { id: b, text: "Para enlazar la tabla con una fila de otra tabla" }
    - { id: c, text: "Para impedir que se borren filas de la tabla" }
    - { id: d, text: "Para ordenar los resultados de cualquier consulta" }
  correct: a
  explanation: "La clave primaria identifica cada fila, de modo que sus valores no pueden repetirse. El enlace con otra tabla lo hace una clave foránea."

- id: sql-count-001
  topic: sql
  difficulty: intermedio
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE scores (value INTEGER);
    INSERT INTO scores VALUES (10), (NULL), (30);

    SELECT COUNT(*), COUNT(value) FROM scores;
  options:
    - { id: a, text: "3|3" }
    - { id: b, text: "2|2" }
    - { id: c, text: "3|2" }
    - { id: d, text: "2|3" }
  correct: c
  explanation: "`COUNT(*)` cuenta todas las filas, mientras que `COUNT(columna)` ignora las que tienen NULL en esa columna."
  verify: output

- id: sql-join-001
  topic: sql
  difficulty: intermedio
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE users (id INTEGER, name TEXT);
    CREATE TABLE orders (user_id INTEGER);
    INSERT INTO users VALUES (1, 'Ana'), (2, 'Luis');
    INSERT INTO orders VALUES (1), (1);

    SELECT u.name, COUNT(o.user_id)
    FROM users u
    LEFT JOIN orders o ON o.user_id = u.id
    GROUP BY u.id
    ORDER BY u.id;
  options:
    - { id: a, text: "Ana|2" }
    - { id: b, text: "Ana|2\nLuis|0" }
    - { id: c, text: "Ana|2\nLuis|1" }
    - { id: d, text: "Ana|1\nLuis|0" }
  correct: b
  explanation: "`LEFT JOIN` conserva a Luis aunque no tenga pedidos, con NULL en las columnas de `orders`. `COUNT(o.user_id)` ignora ese NULL y da 0."
  verify: output

- id: sql-having-001
  topic: sql
  difficulty: intermedio
  type: concept
  prompt: "¿Qué diferencia hay entre `WHERE` y `HAVING`?"
  options:
    - { id: a, text: "`WHERE` filtra filas antes de agrupar y `HAVING` filtra grupos después" }
    - { id: b, text: "`HAVING` filtra filas antes de agrupar y `WHERE` filtra grupos después" }
    - { id: c, text: "`WHERE` solo admite números y `HAVING` admite cualquier tipo de dato" }
    - { id: d, text: "Son equivalentes, pero `HAVING` obliga a usar un índice de la tabla" }
  correct: a
  explanation: "`WHERE` actúa sobre las filas antes de `GROUP BY`, así que no puede usar agregados. `HAVING` actúa sobre los grupos ya formados, por ejemplo con `HAVING COUNT(*) > 1`."

- id: sql-ventana-001
  topic: sql
  difficulty: avanzado
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE sales (seller TEXT, amount INTEGER);
    INSERT INTO sales VALUES ('Ana', 10), ('Ana', 30), ('Luis', 20);

    SELECT seller, amount,
           RANK() OVER (PARTITION BY seller ORDER BY amount DESC)
    FROM sales
    ORDER BY seller, amount;
  options:
    - { id: a, text: "Ana|10|2\nAna|30|1\nLuis|20|1" }
    - { id: b, text: "Ana|10|1\nAna|30|2\nLuis|20|1" }
    - { id: c, text: "Ana|10|3\nAna|30|1\nLuis|20|2" }
    - { id: d, text: "Ana|40|1\nLuis|20|2" }
  correct: a
  explanation: "`PARTITION BY` calcula el ranking por separado para cada vendedor, y `ORDER BY amount DESC` da el puesto 1 al importe mayor. Una función de ventana no agrupa filas: las conserva todas."
  verify: output

- id: sql-notin-001
  topic: sql
  difficulty: avanzado
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE a (x INTEGER);
    CREATE TABLE b (y INTEGER);
    INSERT INTO a VALUES (1), (2);
    INSERT INTO b VALUES (2), (NULL);

    SELECT COUNT(*) FROM a WHERE x NOT IN (SELECT y FROM b);
  options:
    - { id: a, text: "0" }
    - { id: b, text: "1" }
    - { id: c, text: "2" }
    - { id: d, text: "NULL" }
  correct: a
  explanation: "x = 2 se descarta porque está en la subconsulta. Con x = 1 hay que compararlo también con NULL, lo que da un resultado desconocido, y `WHERE` descarta la fila. `NOT EXISTS` evita este problema."
  verify: output

- id: sql-indice-001
  topic: sql
  difficulty: avanzado
  type: concept
  prompt: "Con un índice compuesto sobre `(a, b)`, ¿qué filtro no puede, por lo general, usarlo para localizar las filas directamente?"
  options:
    - { id: a, text: "`WHERE a = 1`" }
    - { id: b, text: "`WHERE a = 1 AND b = 2`" }
    - { id: c, text: "`WHERE b = 2`" }
    - { id: d, text: "`WHERE a = 1 AND b > 2`" }
  correct: c
  explanation: "El índice se ordena primero por `a` y después por `b`, así que las búsquedas deben partir de sus columnas iniciales. Algunos motores pueden aprovecharlo con técnicas como el salto de índice, pero suele ser menos eficiente."

- id: sql-distinct-001
  topic: sql
  difficulty: principiante
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE users (city TEXT);
    INSERT INTO users VALUES ('Madrid'), ('Madrid'), ('Lima');

    SELECT COUNT(DISTINCT city) FROM users;
  options:
    - { id: a, text: "3" }
    - { id: b, text: "1" }
    - { id: c, text: "2" }
    - { id: d, text: "Madrid" }
  correct: c
  explanation: "`DISTINCT` descarta los valores repetidos antes de contar, así que solo cuenta Madrid y Lima."
  verify: output

- id: sql-update-001
  topic: sql
  difficulty: principiante
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE items (name TEXT, stock INTEGER);
    INSERT INTO items VALUES ('a', 1), ('b', 2);

    UPDATE items SET stock = 0 WHERE name = 'a';

    SELECT SUM(stock) FROM items;
  options:
    - { id: a, text: "0" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "1" }
  correct: b
  explanation: "`WHERE` limita el cambio a la fila 'a', cuyo stock pasa a 0. La suma es 0 + 2. Sin `WHERE`, se modificarían todas las filas."
  verify: output

- id: sql-like-001
  topic: sql
  difficulty: principiante
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE users (name TEXT);
    INSERT INTO users VALUES ('Ana'), ('Andrés'), ('Luis');

    SELECT COUNT(*) FROM users WHERE name LIKE 'An%';
  options:
    - { id: a, text: "1" }
    - { id: b, text: "3" }
    - { id: c, text: "0" }
    - { id: d, text: "2" }
  correct: d
  explanation: "En `LIKE`, `%` equivale a cualquier secuencia de caracteres, también vacía. El patrón `An%` coincide con Ana y con Andrés."
  verify: output

- id: sql-delete-001
  topic: sql
  difficulty: principiante
  type: concept
  prompt: "¿Qué hace `DELETE FROM users` sin una cláusula `WHERE`?"
  options:
    - { id: a, text: "Da un error, porque `WHERE` es obligatorio" }
    - { id: b, text: "Borra la tabla y su estructura" }
    - { id: c, text: "Borra todas las filas y conserva la tabla" }
    - { id: d, text: "Borra solo la primera fila de la tabla" }
  correct: c
  explanation: "Sin `WHERE`, `DELETE` afecta a todas las filas, pero la tabla sigue existiendo, vacía. Para eliminar también la tabla se usa `DROP TABLE`."

- id: sql-group-001
  topic: sql
  difficulty: intermedio
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE sales (seller TEXT, amount INTEGER);
    INSERT INTO sales VALUES ('Ana', 5), ('Ana', 10), ('Luis', 7);

    SELECT seller, SUM(amount)
    FROM sales
    GROUP BY seller
    HAVING SUM(amount) > 10;
  options:
    - { id: a, text: "Ana|15" }
    - { id: b, text: "Ana|15\nLuis|7" }
    - { id: c, text: "Ana|10" }
    - { id: d, text: "Ana|5\nAna|10" }
  correct: a
  explanation: "`GROUP BY` agrupa las ventas por vendedor y `HAVING` filtra los grupos: Ana suma 15 y pasa el filtro, mientras que Luis suma 7 y no."
  verify: output

- id: sql-inner-001
  topic: sql
  difficulty: intermedio
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE users (id INTEGER, name TEXT);
    CREATE TABLE orders (user_id INTEGER);
    INSERT INTO users VALUES (1, 'Ana'), (2, 'Luis');
    INSERT INTO orders VALUES (1);

    SELECT u.name
    FROM users u
    INNER JOIN orders o ON o.user_id = u.id;
  options:
    - { id: a, text: "Ana\nLuis" }
    - { id: b, text: "Luis" }
    - { id: c, text: "Ana" }
    - { id: d, text: "Ana\nNULL" }
  correct: c
  explanation: "`INNER JOIN` solo conserva las filas con coincidencia en ambas tablas. Luis no tiene pedidos, así que no aparece. Con `LEFT JOIN` sí aparecería."
  verify: output

- id: sql-null-001
  topic: sql
  difficulty: intermedio
  type: code
  language: sql
  prompt: "¿Qué devuelven las dos consultas?"
  code: |
    CREATE TABLE t (v INTEGER);
    INSERT INTO t VALUES (1), (NULL);

    SELECT COUNT(*) FROM t WHERE v = NULL;
    SELECT COUNT(*) FROM t WHERE v IS NULL;
  options:
    - { id: a, text: "1\n1" }
    - { id: b, text: "0\n1" }
    - { id: c, text: "1\n0" }
    - { id: d, text: "0\n0" }
  correct: b
  explanation: "Comparar con `= NULL` nunca es verdadero, porque el resultado es desconocido, ni siquiera si el valor es NULL. Para comprobarlo se usa `IS NULL`."
  verify: output

- id: sql-foranea-001
  topic: sql
  difficulty: intermedio
  type: concept
  prompt: "¿Qué garantiza una clave foránea?"
  options:
    - { id: a, text: "Que una columna no tenga valores repetidos" }
    - { id: b, text: "Que las consultas sobre esa columna sean más rápidas" }
    - { id: c, text: "Que la columna se rellene automáticamente" }
    - { id: d, text: "Que sus valores existan en la tabla a la que hace referencia" }
  correct: d
  explanation: "La clave foránea protege la integridad referencial: impide, por ejemplo, un pedido de un usuario que no existe. Algunos motores no crean un índice para ella automáticamente."

- id: sql-recursiva-001
  topic: sql
  difficulty: avanzado
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    WITH RECURSIVE numbers(i) AS (
      SELECT 1
      UNION ALL
      SELECT i + 1 FROM numbers WHERE i < 3
    )
    SELECT SUM(i) FROM numbers;
  options:
    - { id: a, text: "3" }
    - { id: b, text: "6" }
    - { id: c, text: "10" }
    - { id: d, text: "1" }
  correct: b
  explanation: "La consulta recursiva parte de 1 y añade `i + 1` mientras `i` sea menor que 3, lo que genera 1, 2 y 3. Su suma es 6."
  verify: output

- id: sql-rownumber-001
  topic: sql
  difficulty: avanzado
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE scores (player TEXT, points INTEGER);
    INSERT INTO scores VALUES ('Ana', 5), ('Ana', 9), ('Luis', 7);

    SELECT player, points
    FROM (
      SELECT player, points,
             ROW_NUMBER() OVER (PARTITION BY player ORDER BY points DESC) AS position
      FROM scores
    )
    WHERE position = 1
    ORDER BY player;
  options:
    - { id: a, text: "Ana|5\nLuis|7" }
    - { id: b, text: "Ana|9" }
    - { id: c, text: "Ana|9\nLuis|7" }
    - { id: d, text: "Ana|14\nLuis|7" }
  correct: c
  explanation: "`ROW_NUMBER` numera las filas de cada jugador empezando por la mayor puntuación. Al filtrar por la posición 1 se obtiene la mejor puntuación de cada uno."
  verify: output

- id: sql-transaccion-001
  topic: sql
  difficulty: avanzado
  type: code
  language: sql
  prompt: "¿Qué devuelve la consulta?"
  code: |
    CREATE TABLE accounts (balance INTEGER);
    INSERT INTO accounts VALUES (100);

    BEGIN;
    UPDATE accounts SET balance = 50;
    ROLLBACK;

    SELECT balance FROM accounts;
  options:
    - { id: a, text: "50" }
    - { id: b, text: "0" }
    - { id: c, text: "NULL" }
    - { id: d, text: "100" }
  correct: d
  explanation: "`ROLLBACK` deshace todos los cambios de la transacción, de modo que el saldo vuelve a su valor anterior. Con `COMMIT`, el cambio se habría confirmado."
  verify: output

- id: sql-aislamiento-001
  topic: sql
  difficulty: avanzado
  type: concept
  prompt: "¿Qué anomalía evita el nivel de aislamiento READ COMMITTED?"
  options:
    - { id: a, text: "Las lecturas sucias de datos aún sin confirmar" }
    - { id: b, text: "Las lecturas no repetibles dentro de una transacción" }
    - { id: c, text: "Las filas fantasma dentro de una transacción" }
    - { id: d, text: "Cualquier conflicto entre transacciones" }
  correct: a
  explanation: "READ COMMITTED garantiza que solo se leen datos confirmados. Las lecturas no repetibles y las filas fantasma requieren, según el estándar, niveles más altos."
